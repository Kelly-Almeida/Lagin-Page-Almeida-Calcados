<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calçados Almeida</title>

    <link rel="stylesheet" href="/CSS/styleNav.css">
    <link rel="stylesheet" href="/CSS/styleEmDestaque.css">
    <link rel="stylesheet" href="/CSS/styleBody.css">
    <link rel="stylesheet" href="/CSS/styleCarrossel.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="containerTotal">
        <header>

            <nav class="navbar navbar-expand-lg navbar-dark"
                style="background-color: rgb(27, 53, 44);">

                <div class="container">

                    <a class="navbar-brand" href="#">
                        <img
                            src="/imagens/headerDivIMG/Logo.png"
                            alt="Logo Almeida"
                            height="130">
                    </a>

                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse" id="menuPrincipal">

                        <ul class="navbar-nav ms-auto">

                            <li class="nav-item c-White">
                                <a class="nav-link" href="#EmDestaques">Destaques</a>
                            </li>

                            <li class="nav-item c-White">
                                <a class="nav-link" href="#">Chinelos</a>
                            </li>

                            <li class="nav-item c-White">
                                <a class="nav-link" href="#">Sandálias</a>
                            </li>

                            <li class="nav-item c-White">
                                <a class="nav-link" href="#">Botas</a>
                            </li>

                        </ul>

                    </div>

                </div>

            </nav>


            <div class="container my-5">

                <div class="row align-items-center">


                    <div class="col-lg-4 text-center">

                        <img
                            src="/imagens/headerDivIMG/osMelhoresCalcadosText.png"
                            alt="Os Melhores Calçados"
                            class="img-fluid mb-3 melhoresCalcadosText">

                        <a href="#Produtos" class="btn btn-success px-4"
                            style="background-color: rgb(27, 53, 44);border-radius: 0;">
                            COMPRE JÁ!!
                        </a>

                    </div>


                    <div class="col-lg-8 text-center">

                        <img
                            src="/imagens/headerDivIMG/OsMelhoresCalcados.png"
                            alt="Os Melhores Calçados"
                            class="img-fluid imgOsMelhoresCalcados">

                    </div>

                </div>

            </div>

        </header>

        <section id="Produtos">
            <!--Em destaques-->
            <div class="Verde">
                    <div class="EmDestaques" id="EmDestaques">
                        <div class="EmDestaqueTitulo">
                            <div class="tituloEmDestaque">
                                <img src="/imagens/headerDivIMG/brilhoBranco.png" alt="Brilho" class ="brilho">
                                <h2>Em Destaque</h2>
                                <img src="/imagens/headerDivIMG/brilhoBranco.png" alt="Brilho" class ="brilho">                            
                            </div>
                        </div>

                        <div class="container my-5 telaInteiras" >
                    
                            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner">
                                    
                                    <div class="carousel-item active">
                                        <div class="row text-center">
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/HavainaBrancaPersonalizada.png" alt="Chinelo Havaianas" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Havaianas Personalizada</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                                
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/sapatoSocial.png" alt="Sapato social de couro preto" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Sapato Social</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                                
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/SandaliaPretaEstrela.png" alt="Chinelo Papeti preta" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Sandalia Papete</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="carousel-item">
                                        <div class="row text-center">
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/botaMarrom.png" alt="Bota Marrom" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Bota Marrom</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/HavainaBrasil.png" alt="Sandália Havainas Brasil" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Havaianas Brasil</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4 mb-3">
                                                <div class="tamanItem p-3">
                                                    <img src="/imagens/CarrosselProdutos/BotaCouroPreto.png" alt="Bota de Couro Preto" class="img-fluid bg-transparent">
                                                    <h3 class="emDesestaquesH3">Bota de Couro Preto</h3>
                                                    <div class="butaoProdutoDestaque mt-2">
                                                        <a href="#" class="botao-Verde">Pedir já!</a>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            
                                        </div>
                                    </div>

                                </div>

                                <button class="carousel-control-prev ladoEsquerdo" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true" style="filter: invert(1);"></span>
                                    <span class="visually-hidden">Anterior</span>
                                </button>
                                <button class="carousel-control-next ladoDireito" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true" style="filter: invert(1);"></span>
                                    <span class="visually-hidden">Próximo</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
